[package]
name = "regards-desktop"
description = "Regards desktop app (Tauri 2 shell)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "regards-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
regards-core.workspace = true
regards-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-single-instance = "2.5"
# The file picker, used from Rust only: the WebView is granted none of its commands.
tauri-plugin-dialog = "2.8"
getrandom.workspace = true
open = "5.4"
tokio.workspace = true

[lints]
workspace = true
