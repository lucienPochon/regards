[workspace]
resolver = "3"
members = [
    "crates/regards-core",
    "crates/regards-ipc",
    "crates/regards-daemon",
    "crates/regards-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0 OR MIT"
publish = false

[workspace.dependencies]
regards-core = { path = "crates/regards-core" }
regards-ipc = { path = "crates/regards-ipc" }
regards-daemon = { path = "crates/regards-daemon" }

anyhow = "1"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
match_wildcard_for_single_variants = "warn"
unchecked_time_subtraction = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
