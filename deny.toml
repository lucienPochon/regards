# cargo-deny policy (ADR-0002, ADR-0004): permissive licences only, no unknown sources.
# Run with: cargo deny check

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error is unmaintained (not a vulnerability). It is a build-time
    # macro reached only through Tauri's Linux GTK stack (gtk-rs 0.18 / glib-macros).
    # Remove this entry when Tauri moves to a gtk-rs release without it.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, via tauri -> gtk 0.18 -> glib-macros; no maintained alternative in Tauri 2.12" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
