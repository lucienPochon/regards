name: Website

# The public page that presents Regards (website/). This checks that it
# builds; Vercel publishes it (website/README.md). Actions are pinned as in
# ci.yml.

on:
  push:
    branches: [main]
    paths: ["website/**", "Cargo.toml", "vercel.json", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", "Cargo.toml", "vercel.json", ".github/workflows/website.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build
        run: node website/build.mjs
