[package]
name = "regards-imap"
description = "Regards IMAP client: TLS, sign-in and (later) sync, on imap-next + imap-codec (ADR-0009)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regards-core.workspace = true
regards-net.workspace = true
# Pinned exactly: imap-codec is a 2.0 pre-release, and every update is reviewed
# (docs/research/07-imap-library-spike.md §7).
imap-next = { version = "=0.3.4", features = ["ext_condstore_qresync", "tag_generator"] }
imap-codec = "=2.0.0-alpha.9"
imap-types = "=2.0.0-alpha.7"
# imap-codec 2.0.0-alpha.9 turns off nom's default features but uses its
# `alloc` items, so it does not build on its own (spike 07 §5 item 1).
nom = { version = "7", default-features = false, features = ["alloc"] }
# For SEARCH dates; already there through imap-types.
chrono = { version = "0.4", default-features = false }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
rcgen.workspace = true
tempfile.workspace = true
# The fake TLS servers in tests/support.
tokio-rustls.workspace = true

[lints]
workspace = true
