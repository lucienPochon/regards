# The third-party licence list in the app (Support › Licences), generated by
# cargo-about from what the shipped programs link. The licences accepted are
# the same as deny.toml's.
accepted = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
# Only what ships: not the tests' and build tools' crates.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Workspace crates are Regards' own.
private = { ignore = true }
